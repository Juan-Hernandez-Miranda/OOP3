# --- Configuracion MySQL (Variables de Entorno) ---
server.port=${PORT:8081}

# --- Configuracion de recursos estaticos (HTML CSS JS) ---
# Asegurar que Spring sirva correctamente los archivos static en Railway
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true
spring.mvc.static-path-pattern=/**

# En local usa localhost en Railway usa las variables que ellos inyectan
spring.datasource.url=jdbc:mysql://localhost:3306/agenda?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password= #aqui vas a poner la contraseña de tu base de datos, de tu usuario
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desactivar migraciones automaticas de Flyway aqui porque el core de Flyway tiene problemas de compatibilidad
# con la version de la base de datos en este entorno. Hibernate `update`
# agregara la columna `folio` y el DataLoader completara folios faltantes.
spring.flyway.enabled=false

